# The course lab: one Kafka broker (KRaft mode), the Kafka UI, Grafana and PostgreSQL.
#   Start:                   docker compose up -d
#   Stop (keep your data):   docker compose stop
# Kafka UI: http://localhost:8085   Grafana: http://localhost:3000   PostgreSQL: localhost:5433
# Kafka from your laptop (Node.js): localhost:9092
name: kafka-lab

services:
  kafka:
    image: apache/kafka:4.3.2
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # PLAINTEXT = for programs on your laptop, DOCKER = for the Kafka UI and Grafana
      KAFKA_LISTENERS: PLAINTEXT://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      # One broker, so Kafka's own internal topics keep one copy
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # A typo in a topic name should fail, not quietly create a new topic
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Check for expired data every 10 s (default 5 min) so the retention lab is quick
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 10000
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Keep memory low enough for a laptop
      KAFKA_HEAP_OPTS: -Xmx512M -Xms512M
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: lab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on: [kafka]

  # Live dashboards, reading Kafka directly through the Kafka data source plugin.
  # Lab only: no login. The plugin downloads on first start (needs internet once).
  grafana:
    image: grafana/grafana:13.2.4-slim
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_PLUGINS_PREINSTALL_SYNC: hamedkarbasi93-kafka-datasource@1.9.1
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml:ro
      - grafana-data:/var/lib/grafana
    depends_on: [kafka]

  # The database where db-writer.js saves every reading (Day 2).
  # Lab-only password. From your laptop: localhost:5433 (5433, in case you already run PostgreSQL on 5432)
  postgres:
    image: postgres:18.6-alpine
    container_name: postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: kafka
      POSTGRES_PASSWORD: kafka-lab
      POSTGRES_DB: sungai
    volumes:
      - postgres-data:/var/lib/postgresql

volumes:
  kafka-data:
  grafana-data:
  postgres-data:
